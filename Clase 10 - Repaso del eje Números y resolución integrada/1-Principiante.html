<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 · Clase 10 · Principiante</title>
<style>
:root{--primary:#4B2363;--accent:#B37D48;--level:#166534;--ink:#0F172A;--bg:#F8FAFC;--card:#fff;--ok:#166534;--bad:#991B1B;--line:#CBD5E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#fff;border-top:6px solid var(--primary);border-bottom:5px solid var(--level);display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.logo{height:92px;width:auto;flex:0 0 auto}
.logo img{height:100%;width:auto;display:block}
@media(max-width:640px){header{position:static}.logo{height:80px}}
.badge{background:var(--level);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px}
.meta{margin-left:auto;font-weight:700;font-size:15px}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{height:10px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:4px 0 16px}
.bar>i{display:block;height:100%;background:var(--level);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.skill{display:inline-block;background:#E0E7FF;color:#1E1B4B;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.stem{font-size:19px;font-weight:600;margin:4px 0 12px}
.fig{border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px;background:#fff}
.fig svg{display:block;width:100%;height:auto;max-height:340px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;color:var(--ink);cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--level)}
.opt b{flex:0 0 32px;height:32px;border-radius:50%;background:var(--level);color:#fff;display:grid;place-items:center;font-size:15px}
.opt.ok{border-color:var(--ok);background:#DCFCE7}
.opt.bad{border-color:var(--bad);background:#FEE2E2}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:#F1F5F9;border-left:6px solid var(--level);display:none}
.btn{background:var(--level);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:800;cursor:pointer;margin-top:14px}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.big{font-size:44px;font-weight:900;color:var(--level)}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.tag-ok{color:var(--ok);font-weight:800}.tag-bad{color:var(--bad);font-weight:800}
</style>
</head>

inador pero restó mal los numeradores amplificados"],"s":"Argumentar","e":"Restó numeradores y denominadores por separado en lugar de amplificar a un común denominador."},{"q":"Usando la tabla, ¿entre cuáles números enteros consecutivos se encuentra √195?","svg":"<svg viewBox=\"0 0 560 144\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Tabla\"><rect width=\"560\" height=\"144\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"30.0\" width=\"500.0\" height=\"42.0\" fill=\"#E0F2FE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"80.0\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">11²<\/text><text x=\"180.0\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">12²<\/text><text x=\"280.0\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">13²<\/text><text x=\"380.0\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">14²<\/text><text x=\"480.0\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">15²<\/text><rect x=\"30.0\" y=\"72.0\" width=\"500.0\" height=\"42.0\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"80.0\" y=\"99.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">121<\/text><text x=\"180.0\" y=\"99.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">144<\/text><text x=\"280.0\" y=\"99.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">169<\/text><text x=\"380.0\" y=\"99.3\" font-size=\"17\" font-weight=\"700\" text-an ,Helvetica,sans-serif\">Razón 7 : 5 → fracción 7/5 del total<\/text><\/svg>","o":["La fracción del total es a/(a + b), no a/b: la razón compara partes, no parte con total","La fracción del total es b/(a + b), porque se toma la segunda parte primero","La razón debe dividirse por la suma de las partes y luego multiplicarse por dos","La razón es directamente la fracción del total, pero simplificada al máximo","Debe restarse la segunda parte a la primera antes de formar la fracción"],"s":"Argumentar","e":"La fracción del total es a/(a + b), no a/b: la razón compara partes, no parte con total."},{"q":"En un mapa a escala 1 : 5.000, la distancia entre A y B mide 12 cm. ¿Cuál es la distancia real entre A y B?","svg":"<svg viewBox=\"0 0 560 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Mapa con dos puntos y su escala\"><rect width=\"560\" height=\"220\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"30.0\" width=\"500.0\" height=\"170.0\" fill=\"#ECFCCB\" stroke=\"#3F6212\" stroke-width=\"3\"/><line x1=\"120.0\" y1=\"130.0\" x2=\"440.0\" y2=\"130.0\" stroke=\"#9A3412\" stroke-width=\"5\"/><circle cx=\"120.0\" cy=\"130.0\" r=\"8\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><circle cx=\"440.0\" cy=\"130.0\" r=\"8\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><rect x=\"106.7\" y=\"85.5\" width=\"26.5\" height=\"29\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"120.0\" y=\"106.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">A<\/text><rect x=\"426.7\" y=\"85.5\" width=\"26.5\" height=\"29\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"440.0\" y=\"106.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">B<\/text><rect x=\"187.7\" y=\"145.5\" width=\"184.6\" height=\"29\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5 :"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: 6/4 − 8/3 = −2/1\"><rect width=\"560\" height=\"120\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"70.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"55.3\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"78.7\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">6/4 − 8/3 = −2/1<\/text><\/svg>","o":["Restó numeradores y denominadores por separado en lugar de amplificar a un común denominador","Restó los denominadores pero sumó los numeradores de ambas fracciones","Multiplicó ambos denominadores y restó los numeradores sin amplificarlos","Restó la segunda fracción de la primera pero cambió el orden de los términos","Calculó bien el común denominador pero restó mal los numeradores amplificados"],"s":"Argumentar","e":"Restó numeradores y denominadores por separado en lugar de amplificar a un común denominador."},{"q":"Una persona gasta su dinero como indica la figura. ¿Cuánto dinero le queda?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Dinero inicial: $360 Gasta 1/4 del total Luego gasta 1/2 de lo que queda\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Dinero inicial: $360<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Gasta 1/4 del total<\/text><text x=\"280.0\" y=\"122.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Luego gasta 1/2 de lo que queda<\/text><\/svg>","o":["$135","$90","$270","$180","$126"],"s":"Modelar","e":"Queda 360·(1 − 1/4)·(1 − 1/2) = $135."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: 9 − (9 − 3) = 9 − 9 − 3 = −3\"><rect width=\"560\" height=\"120\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"70.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"55.3\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"78.7\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">9 − (9 − 3) = 9 − 9 − 3 = −3<\/text><\/svg>","o":["Al quitar el paréntesis precedido por un signo menos, no cambió el signo de 3","Sumó primero los dos primeros números y después restó el paréntesis","Multiplicó el signo menos por el primer número del paréntesis","Sumó los valores absolutos de todos los términos de la expresión","Resolvió la expresión de derecha a izquierda sin cambiar signos"],"s":"Argumentar","e":"Al quitar el paréntesis precedido por un signo menos, no cambió el signo de 3."},{"q":"La tabla muestra el precio anterior y el nuevo precio de un producto. ¿Qué porcentaje varió el precio respecto del anterior?","svg":"<svg viewBox=\"0 0 560 144\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Tabla\"><rect width=\"560\" height=\"144\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"30.0\" width=\"500.0\" height=\"42.0\" fill=\"#E0F2FE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"155.0\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Precio anterior<\/text><text x=\"405.0\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Precio nuevo<\/text><rect x=\"30.0\" y=\"72.0\" width=\"500.0\" height=\"42.0\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"155.0\" y=\"99.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">$40.000<\/text><text x=\"405.0\" y=\"99.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">$52.000<\/text><line x1=\"30.0\" y1=\"30.0\" x2=\"30.0\" y2=\"114.0\" stroke=\"#0B3D6E\" stroke-width=\"2\"/><line x1=\"280.0\" y1=\"30.0\" x2=\"280.0\" y2=\"114.0\" stroke=\"#0B3D6E\" stroke-width=\"2\"/><line x1=\"530.0\" y1=\"30.0\" x2=\"530.0\" y2=\"114.0\" stroke=\"#0B3D6E\" stroke-width=\"2\"/><line x1=\"30.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><line x1=\"30.0\" y1=\"72.0\" x2=\"530.0\" y2=\"72.0\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><line x1=\"30.0\" y1=\"114.0\" x2=\"530.0\" y2=\"114.0\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><\/svg>","o":["Aumento de 30%","Disminución de 30%","Aumento de 23,08%","Disminución de 23,08%","Aumento de 120%"],"s":"Representar","e":"Variación = (520 − 400)/400 = 30%."}];
const MAX_GAP=16;
const SKILLS=["Resolver problemas","Modelar","Representar","Argumentar"];
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
// Validación en el navegador: 5 opciones únicas y correcta <= distractor más largo + 16.
function valid(q){
  if(!q||!Array.isArray(q.o)||q.o.length!==5||new Set(q.o).size!==5)return false;
  const longest=Math.max(...q.o.slice(1).map(s=>[...s].length));
  return [...q.o[0]].length-longest<=MAX_GAP;
}
const GOOD=BANK.filter(valid);
if(GOOD.length!==BANK.length)console.warn("Preguntas descartadas por validación:",BANK.length-GOOD.length);
function pick(){
  const base=Math.floor(CFG.n/SKILLS.length), extra=CFG.n%SKILLS.length, out=[];
  // Las preguntas sobrantes (p. ej. 10 = 3+3+2+2) se reparten al azar entre las habilidades.
  shuffle(SKILLS).forEach((s,i)=>{
    const pool=shuffle(GOOD.filter(q=>q.s===s));
    out.push(...pool.slice(0,base+(i<extra?1:0)));
  });
  // Si algún eje quedó corto, completa desde el resto del banco.
  if(out.length<CFG.n){const rest=shuffle(GOOD.filter(q=>!out.includes(q)));out.push(...rest.slice(0,CFG.n-out.length))}
  // >= 90% con imagen: reemplaza sin imagen por otras con imagen si hiciera falta.
  const need=Math.ceil(CFG.n*0.9);
  while(out.filter(q=>q.svg).length<need){
    const i=out.findIndex(q=>!q.svg);const alt=shuffle(GOOD.filter(q=>q.svg&&!out.includes(q)))[0];
    if(i<0||!alt)break;out[i]=alt;
  }
  return shuffle(out);
}
function prepare(q){
  // Baraja las opciones; evita rachas de 3 letras iguales en la correcta.
  return {...q,ord:shuffle([0,1,2,3,4])};
}
function build(){
  for(let t=0;t<200;t++){
    const qs=pick().map(prepare);
    const pos=qs.map(q=>q.ord.indexOf(0));
    const run=pos.some((p,i)=>i>1&&p===pos[i-1]&&p===pos[i-2]);
    const cnt=[0,0,0,0,0];pos.forEach(p=>cnt[p]++);
    if(!run&&Math.max(...cnt)<=Math.ceil(CFG.n/5)+1)return qs;
  }
  return pick().map(prepare);
}
let Q,idx,score,answers,t0,timer;
const $=id=>document.getElementById(id);
function start(){
  Q=build();idx=0;score=0;answers=[];t0=Date.now();
  clearInterval(timer);timer=setInterval(tick,1000);render();
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("meta").textContent="⏱ "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+"  ·  "+Math.min(idx+1,Q.length)+"/"+Q.length}
function render(){
  tick();$("bar").style.width=(idx/Q.length*100)+"%";
  const q=Q[idx],app=$("app");
  app.innerHTML="";
  const sk=document.createElement("span");sk.className="skill";sk.textContent="Habilidad: "+q.s;app.append(sk);
  const st=document.createElement("div");st.className="stem";st.textContent=(idx+1)+". "+q.q;app.append(st);
  if(q.svg){const f=document.createElement("div");f.className="fig";f.innerHTML=q.svg;app.append(f)}
  const box=document.createElement("div");box.className="opts";
  q.ord.forEach((k,i)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";
    const l=document.createElement("b");l.textContent="ABCDE"[i];const t=document.createElement("span");t.textContent=q.o[k];
    b.append(l,t);b.onclick=()=>answer(i,box,b);box.append(b);
  });
  app.append(box);
  const fb=document.createElement("div");fb.className="fb";fb.id="fb";app.append(fb);
}
function answer(i,box,btn){
  const q=Q[idx],good=q.ord.indexOf(0),ok=i===good;
  [...box.children].forEach((b,j)=>{b.disabled=true;if(j===good)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  if(ok)score++;answers.push({q,ok,pick:i});
  const fb=$("fb");fb.style.display="block";
  fb.innerHTML="";const h=document.createElement("b");h.className=ok?"tag-ok":"tag-bad";h.textContent=ok?"¡Correcto! ":"Incorrecto. ";
  fb.append(h,document.createTextNode(q.e));
  const nx=document.createElement("button");nx.className="btn";nx.type="button";nx.textContent=idx===Q.length-1?"Ver resultados":"Siguiente →";
  nx.onclick=()=>{idx++;idx>=Q.length?finish():render()};$("app").append(nx);nx.focus();
}
function finish(){
  clearInterval(timer);$("bar").style.width="100%";
  const s=Math.floor((Date.now()-t0)/1000),app=$("app");
  const by={};SKILLS.forEach(k=>by[k]=[0,0]);answers.forEach(a=>{by[a.q.s][1]++;if(a.ok)by[a.q.s][0]++});
  app.innerHTML="";
  const h=document.createElement("div");h.innerHTML='<div class="big"></div><p></p>';
  h.firstChild.textContent=score+" / "+Q.length;h.lastChild.textContent="Porcentaje de logro: "+Math.round(score/Q.length*100)+"%  ·  Tiempo: "+Math.floor(s/60)+" min "+(s%60)+" s";
  app.append(h);
  const tb=document.createElement("table");tb.innerHTML="<tr><th>Habilidad PAES</th><th>Correctas</th></tr>";
  SKILLS.forEach(k=>{const tr=document.createElement("tr");tr.innerHTML="<td></td><td></td>";tr.children[0].textContent=k;tr.children[1].textContent=by[k][0]+" / "+by[k][1];tb.append(tr)});
  app.append(tb);
  answers.forEach((a,n)=>{
    const d=document.createElement("div");d.className="rev";
    const t=document.createElement("div");t.innerHTML='<b></b> <span></span>';
    t.firstChild.className=a.ok?"tag-ok":"tag-bad";t.firstChild.textContent=(n+1)+(a.ok?" ✔":" ✘");t.lastChild.textContent=a.q.q;d.append(t);
    if(a.q.svg){const f=document.createElement("div");f.className="fig";f.style.maxWidth="420px";f.style.marginTop="8px";f.innerHTML=a.q.svg;d.append(f)}
    const c=document.createElement("div");c.textContent="Respuesta correcta: "+a.q.o[0]+". "+a.q.e;d.append(c);app.append(d);
  });
  const b=document.createElement("button");b.className="btn";b.textContent="Nuevo intento (otras preguntas)";b.onclick=start;app.append(b);
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{const o=document.querySelectorAll(".opt:not(:disabled)");if(o.length&&"12345".includes(e.key))o[+e.key-1]?.click();else if(e.key==="Enter"){const n=document.querySelector(".btn");n&&n.click()}});
start();
